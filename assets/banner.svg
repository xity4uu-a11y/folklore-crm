<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Folklore CRM — Plain-Text Git-Backed Micro-CRM">
  <defs>
    <pattern id="hairline-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E2128" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" rx="16" fill="#0E1014"/>
  <rect width="1200" height="340" rx="16" fill="url(#hairline-grid)"/>
  <rect x="1" y="1" width="1198" height="338" rx="15" fill="none" stroke="#262A33" stroke-width="1.5"/>

  <!-- Left architectural brand panel -->
  <g transform="translate(56, 54)">
    <rect width="42" height="42" rx="10" fill="#F2F4F8"/>
    <path d="M13 10H29V15H18V19.5H27V24H18V32H13V10Z" fill="#0E1014"/>
    <circle cx="28" cy="29.5" r="2.6" fill="#0E1014"/>

    <text x="58" y="21" fill="#8C93A1" font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" letter-spacing="1.6">PLAIN-TEXT GIT-BACKED CRM</text>
    <text x="58" y="40" fill="#F4F5F7" font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.4">Folklore CRM</text>
  </g>

  <text x="56" y="148" fill="#F4F5F7" font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.9">Stop paying $50/seat for HubSpot.</text>
  <text x="56" y="186" fill="#A4ACB9" font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, sans-serif" font-size="18" font-weight="400">Your contacts live as plain-text Markdown in local Git. Zero cloud lock-in.</text>

  <!-- Minimalist telemetry pills -->
  <g transform="translate(56, 224)" font-family="JetBrains Mono, SF Mono, Consolas, monospace" font-size="12">
    <rect x="0" y="0" width="128" height="32" rx="7" fill="#161920" stroke="#2B303B"/>
    <text x="16" y="20" fill="#D5D9E2">RUST + TAURI v2</text>

    <rect x="140" y="0" width="128" height="32" rx="7" fill="#161920" stroke="#2B303B"/>
    <text x="156" y="20" fill="#D5D9E2">contacts/*.md</text>

    <rect x="280" y="0" width="116" height="32" rx="7" fill="#161920" stroke="#2B303B"/>
    <text x="296" y="20" fill="#D5D9E2">GIT HISTORY</text>

    <rect x="408" y="0" width="112" height="32" rx="7" fill="#14261C" stroke="#244632"/>
    <text x="424" y="20" fill="#7AC894">PRICE $0/SEAT</text>
  </g>

  <text x="56" y="294" fill="#6F7785" font-family="JetBrains Mono, SF Mono, Consolas, monospace" font-size="11.5">folklore init ./vault  |  git log contacts/elena-rostova.md  |  folklore export --format vcf</text>

  <!-- Right architectural file preview card -->
  <g transform="translate(758, 44)">
    <rect width="388" height="252" rx="12" fill="#13161C" stroke="#2A2F3A" stroke-width="1"/>
    <line x1="0" y1="36" x2="388" y2="36" stroke="#242933" stroke-width="1"/>
    <circle cx="20" cy="18" r="4.5" fill="#323742"/>
    <circle cx="36" cy="18" r="4.5" fill="#323742"/>
    <circle cx="52" cy="18" r="4.5" fill="#323742"/>
    <text x="72" y="22" fill="#9AA2B1" font-family="JetBrains Mono, SF Mono, Consolas, monospace" font-size="11.5">contacts/elena-rostova.md</text>
    <rect x="312" y="9" width="62" height="18" rx="9" fill="#14261C" stroke="#244632"/>
    <text x="323" y="21.5" fill="#7AC894" font-family="JetBrains Mono, SF Mono, Consolas, monospace" font-size="10">main</text>

    <g transform="translate(18, 56)" font-family="JetBrains Mono, SF Mono, Consolas, monospace" font-size="11.5">
      <text x="0" y="0" fill="#677080">---</text>
      <text x="0" y="19" fill="#9AA2B1">name: <tspan fill="#ECEFF4">Elena Rostova</tspan></text>
      <text x="0" y="38" fill="#9AA2B1">company: <tspan fill="#ECEFF4">Northstar Systems</tspan></text>
      <text x="0" y="57" fill="#9AA2B1">stage: <tspan fill="#7AC894">won</tspan></text>
      <text x="0" y="76" fill="#9AA2B1">deal_value: <tspan fill="#ECEFF4">24000</tspan></text>
      <text x="0" y="95" fill="#9AA2B1">tags: <tspan fill="#C9D0DC">[enterprise, security]</tspan></text>
      <text x="0" y="114" fill="#677080">---</text>
      <text x="0" y="140" fill="#D5D9E2">## Timeline</text>
      <text x="0" y="159" fill="#8C93A1">- 2026-11-22 | call | SOC2 approved</text>
      <text x="0" y="182" fill="#D5D9E2">## Tasks</text>
      <text x="0" y="201" fill="#7AC894">- [x] Replace 45 HubSpot seats</text>
    </g>
  </g>
</svg>
